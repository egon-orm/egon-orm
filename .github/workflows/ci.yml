name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request supersedes the old run; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Includes docs/plan/spikes/schema-typing.ts (the regression test for decision D1) and
      # the assertion that rejected-const-thunks.ts still fails to compile.
      - run: pnpm typecheck

  test:
    name: unit+types (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      # Runs with coverage; fails below the thresholds in vitest.config.ts.
      - run: pnpm test:unit
      - run: pnpm test:types

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The Postgres service comes from docker-compose.yml, so CI and local runs share one
      # definition of image, port, credentials and server flags.
      # SQLite needs no service: its suites run here too (files in a temporary directory).
      - run: pnpm db:up
      - run: pnpm test:integration
      - if: failure()
        run: docker compose logs --no-color

  integration-tier2:
    name: integration (tier 2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Postgres, SQLite and MySQL 8.4 (the tier2 compose profile); EGON_TEST_TIER2 turns the
      # MySQL suites on. A required check through the ci job below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm db:up:tier2
      - run: pnpm test:integration
        env:
          EGON_TEST_TIER2: "1"
      - if: failure()
        run: docker compose --profile tier2 logs --no-color

  # The integration suites against the oldest supported database releases, Postgres 14 and
  # MySQL 8.0.31 (the floors in docs/site/reference/upgrading.md), from the `floors` compose
  # profile on ports of their own. SQLite's suites run here too. A required check through the
  # ci job below.
  integration-floors:
    name: integration (database floors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm db:up:floors
      - name: Print the server versions
        run: |
          docker compose exec -T postgres-floor psql -U egon -d egon_dev -tAc "select version()"
          docker compose exec -T mysql-floor mysql -uroot -pegon -h 127.0.0.1 -NBe "select version()"
      - run: pnpm test:integration
        env:
          EGON_TEST_TIER2: "1"
          EGON_PG_PORT: "54314"
          EGON_MYSQL_PORT: "33031"
      - if: failure()
        run: docker compose --profile floors logs --no-color

  build:
    name: build+publint+attw
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Before anything is built: the benchmark runner must refuse to run without dist/.
      - run: node scripts/check-bench-dist-guard.mjs
      - run: pnpm build
      # The public API of every entry point (api-report/, written by api-extractor from the
      # built declarations) must match the committed report: an API change is reviewed as one.
      - run: pnpm api:check
      # Edge runtimes resolve Node built-ins only as node:… (step 21a).
      - run: node scripts/check-node-specifiers.mjs
      - run: pnpm lint:packages
      # Node 22.12.0, the first release that can require() an ES module (decision D14): the
      # consumers below run on it as well as on the latest 22. The tarball's checksum is pinned,
      # and the tarball is cached under that checksum, so a run needs nodejs.org only on a miss.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/node-cache/node-v22.12.0-linux-x64.tar.xz
          key: node-v22.12.0-linux-x64-22982235e1b71fa8850f82edd09cdae7e3f32df1764a9ec298c72d25ef2c164f
      - name: Node 22.12.0
        run: |
          mkdir -p ~/node-cache
          if [ ! -f ~/node-cache/node-v22.12.0-linux-x64.tar.xz ]; then
            curl -fsSL -o ~/node-cache/node-v22.12.0-linux-x64.tar.xz https://nodejs.org/dist/v22.12.0/node-v22.12.0-linux-x64.tar.xz
          fi
          echo "22982235e1b71fa8850f82edd09cdae7e3f32df1764a9ec298c72d25ef2c164f  $HOME/node-cache/node-v22.12.0-linux-x64.tar.xz" | sha256sum --check
          tar -xJf ~/node-cache/node-v22.12.0-linux-x64.tar.xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/node-v22.12.0-linux-x64/bin/node" --version
      # An ESM consumer and a CommonJS consumer that require()s the ES modules, in the
      # workspace; then the consumer matrix (examples/smoke/consumer.mjs): a project outside
      # the workspace installs the packed packages with their pinned peers, runs both consumers
      # (on this Node and on 22.12.0) and type-checks a consumer under nodenext, node16,
      # bundler and CommonJS. The install fetches from the registry, so it needs network access.
      - run: pnpm smoke --node "$RUNNER_TEMP/node-v22.12.0-linux-x64/bin/node"
      # Keeps the benchmark harness working. Numbers from shared runners are not meaningful;
      # regression gating is step 19.
      - run: pnpm bench

  # The consumer project of examples/smoke/consumer.mjs, type-checked against the packed
  # packages, every program (nodenext, node16, bundler, CommonJS, json-return), with the
  # oldest supported TypeScript, the newest 5.8.x (TypeScript 5.8 or later: owner decision,
  # 2026-10-22), and with the latest release; the workspace's own TypeScript is covered by
  # `pnpm smoke` in the build job. scripts/typescript-version.mjs picks the versions.
  typescript:
    name: types (typescript ${{ matrix.typescript }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        typescript: [minimum, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Type-check a consumer
        run: node examples/smoke/consumer.mjs --no-runtime --typescript "$(node scripts/typescript-version.mjs "$WHICH")"
        env:
          WHICH: ${{ matrix.typescript }}

  # The same check with TypeScript's `next` build (published daily). Informational: a
  # failure here is a heads-up about the next TypeScript release and does not fail the `ci`
  # check, which does not wait for this job.
  typescript-next:
    name: types (typescript next, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: node examples/smoke/consumer.mjs --no-runtime --typescript "$(node scripts/typescript-version.mjs next)"

  # The peer-dependency ranges at both ends: the consumer matrix with every peer (pg,
  # pg-cursor, @types/pg, better-sqlite3, mysql2, zod) at the lowest version its declared
  # range allows, then at the newest release the range resolves to; each adapter runs against
  # its database and @egon-orm/zod against Zod (examples/smoke/drivers.mjs).
  peers:
    name: peer bounds (${{ matrix.peers }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        peers: [lower, upper]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm db:up:tier2
      - run: pnpm build
      - run: node examples/smoke/consumer.mjs --peers ${{ matrix.peers }} --drivers --no-runtime
        env:
          EGON_TEST_TIER2: "1"
      - if: failure()
        run: docker compose --profile tier2 logs --no-color

  # The release workflow (release.yml) end to end against a local registry (verdaccio), from
  # a clean clone of this commit: version, publish, tags, release notes, install, and the next
  # version. Publishes nothing anywhere else and needs no secret.
  release:
    name: release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: `changeset version` looks up the commit that added each changeset (for
      # the changelog entry), and fails in a shallow clone, as release.yml's jobs would.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm release:dry-run

  # The reference app as a Cloudflare Worker (examples/edge-worker), built with wrangler and
  # run in workerd (Miniflare) against Postgres: three requests, with code generation refused
  # at request time. Never deployed; wrangler is not logged in and sends no telemetry.
  edge-worker:
    name: edge worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm db:up
      - run: pnpm build
      # Prints the Worker's bundle size to the job summary.
      - run: pnpm --filter @egon-orm/example-edge-worker run check
      # The size of the reference app and of subset imports, from the packed packages.
      - run: node scripts/size-report.mjs >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: docker compose logs --no-color

  # The built packages on Node 22 and 24, each doing a round trip against Postgres and SQLite
  # (examples/runtime): an ES module, CommonJS through require(), and esbuild bundles of both;
  # and a Next.js app built with `next build` and served with `next start` (examples/next-app).
  # Required through the ci job below (owner decision, 2026-10-23); Bun runs best effort in
  # runtime.yml.
  runtime:
    name: runtime (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm db:up
      - run: pnpm build
      # The consumer matrix of examples/smoke (ESM and require() from the packed packages,
      # installed outside the workspace) on this Node; the build job runs it on 22 and 22.12.0.
      - run: node examples/smoke/consumer.mjs --no-types
      - run: pnpm --filter @egon-orm/example-runtime run check
      - run: pnpm --filter @egon-orm/example-next-app run check
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - if: failure()
        run: docker compose logs --no-color

  docs:
    name: docs:build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Generates the API reference with TypeDoc (failing on an export without a summary or
      # an @example), then builds the site (failing on a dead link).
      - run: pnpm docs:build
      # A preview of the site as built from this commit; .github/workflows/docs.yml deploys main.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: docs/site/.vitepress/dist
          retention-days: 7

  # One check to require in branch protection: green only if every job above is green.
  ci:
    name: ci
    if: always()
    needs: [lint, typecheck, test, integration, integration-tier2, integration-floors, build, peers, typescript, release, edge-worker, runtime, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
