name: Release

# Releases with Changesets, in two steps (CONTRIBUTING.md, "Releases"):
#
# 1. While changesets are pending on main, the `version` job opens (or updates) the
#    "Version packages" pull request: `pnpm version-packages` bumps every package to one
#    version (the fixed group in .changeset/config.json), writes each package's
#    CHANGELOG.md and the VERSION constants, and removes the changesets.
# 2. When that pull request is merged, no changeset is pending and the versions are not on
#    npm yet. The `pack` job, which holds no credential, builds, runs publint and attw,
#    packs the packages (`changeset pack`), then runs the consumer matrix. The `publish` job then
#    publishes those tarballs (`changeset publish --from-pack-dir`) with provenance, pushes
#    a git tag `<name>@<version>` per package and creates a GitHub release per tag from its
#    CHANGELOG section. It runs no install script: nothing third-party executes while it
#    holds the publish credentials.
#
# Off until the owner turns it on: every job is skipped unless the repository variable
# RELEASE is "on" (Settings > Secrets and variables > Actions > Variables), and it only
# ever runs for main (a manual run on another branch is skipped). So this workflow
# publishes nothing and needs no secret until then. `pnpm release:dry-run` (and the
# `release dry run` job of ci.yml) runs the same commands against a local registry.
#
# Who publishes: the action runs the workspace's `changeset publish`, which, in a pnpm
# workspace, runs `pnpm publish <tarball>` for each package. pnpm 12 publishes by itself (it
# does not call the npm CLI), so the npm CLI's version does not matter here; the `publish`
# job checks that the pnpm on PATH is the one package.json pins.
#
# npm authentication: trusted publishing (OIDC). Each package has this repository, this
# workflow file (release.yml) and the environment `npm` as its trusted publisher on
# npmjs.com; pnpm exchanges the job's OIDC token (`id-token: write`) for a publish token,
# and prefers it to any token in ~/.npmrc. There is no long-lived npm token: the owner
# publishes a 0.0.1 placeholder of each package by hand and sets its trusted publisher before
# RELEASE is turned on, so no publish from here creates a package. The NPM_TOKEN step below
# is a leftover that does nothing while the secret is unset.
#
# The `version` job opens its pull request with the GITHUB_TOKEN. GitHub's docs say the
# `pull_request` runs of such a pull request wait in an approval-required state, so `ci`
# runs once someone with write access selects "Approve workflows to run" in it
# (CONTRIBUTING.md, "Releases").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and never cancelled halfway through a publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mode:
    name: select mode
    if: vars.RELEASE == 'on' && github.repository == 'egon-orm/egon-orm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      publish-plan: ${{ steps.select.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      # "version" while changesets are pending, "publish" when the versions in the
      # manifests are not on npm yet (with the publish plan as an artifact), "none" otherwise.
      - id: select
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: version pull request
    needs: mode
    if: needs.mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm version-packages
          commit-message: Version packages
          pr-title: Version packages

  # Everything that runs third-party code (install scripts, the peers the consumer matrix
  # installs) happens here, with read-only permissions and no npm credential.
  pack:
    name: check and pack
    needs: mode
    if: needs.mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      pack-dir: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      # What is published is what CI checks: the build, publint and attw, and the consumer
      # matrix on the packed packages. The tarballs are packed (and uploaded) before the
      # smoke, which installs peers from npm whose install scripts could otherwise touch
      # dist/; a failing smoke still stops the publish, which needs this job.
      - run: pnpm build
      - run: pnpm lint:packages
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.mode.outputs.publish-plan }}
      - run: pnpm smoke

  publish:
    name: publish
    needs: [mode, pack]
    if: needs.mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment requires the owner's approval for every publish and deploys from main
    # only. Its name is part of each package's trusted publisher on npmjs.com.
    environment: npm
    env:
      # Whether the secret is set (a secret cannot be tested in a step's `if`).
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    permissions:
      contents: write # git tags and GitHub releases, through the API
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # pnpm and Node, then the workspace's tools from the lockfile with no install script
      # (the publish needs only @changesets/cli; the tarballs come from the pack job).
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@22
          cache: false
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # pnpm does the trusted publishing and the provenance itself; the release dry run checks
      # that this pnpm honours PNPM_CONFIG_PROVENANCE. Fail before publishing if another
      # pnpm is on PATH.
      - name: check the publisher
        run: |
          expected="$(node -p 'require("./package.json").packageManager')"
          actual="pnpm@$(pnpm --version)"
          echo "publisher: ${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::the pnpm on PATH is ${actual}; package.json pins ${expected}"
            exit 1
          fi
      # Not used: there is no NPM_TOKEN secret (trusted publishing). Harmless while it is unset.
      - name: npm token (only when the NPM_TOKEN secret is set)
        if: env.HAS_NPM_TOKEN == 'true'
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Publishes the pack job's tarballs (`changeset publish --from-pack-dir`), then tags
      # and releases through the GitHub API (the action sets the git identity the annotated
      # tags need).
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir }}
          create-github-releases: true
        env:
          # pnpm reads PNPM_CONFIG_*, not NPM_CONFIG_* (which it ignores). Provenance is
          # required, not left to pnpm's detection: a publish that cannot attach it fails.
          PNPM_CONFIG_PROVENANCE: "true"
